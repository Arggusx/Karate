<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#EDE7DA" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BC002D" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="8 4" opacity="0.2"/>

  <!-- Kanji Background Watermark -->
  <text x="400" y="320" font-family="'Shippori Mincho', 'Noto Serif JP', serif" font-size="220" font-weight="bold" fill="#BC002D" opacity="0.05" text-anchor="middle" dominant-baseline="middle">演武線</text>

  <!-- Center Graphic: Enbusen T-Shape / Compass line representation -->
  <g transform="translate(400, 240)" opacity="0.25">
    <!-- Outer Ring -->
    <circle r="90" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 4"/>
    <circle r="98" fill="none" stroke="#BC002D" stroke-width="1.5"/>

    <!-- Compass Lines -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#1A1A1A" stroke-width="2.5"/>
    
    <!-- Direction Arrows -->
    <polygon points="0,-120 -8,-100 8,-100" fill="#BC002D"/>
    <polygon points="120,0 100,-8 100,8" fill="#1A1A1A"/>
    <polygon points="-120,0 -100,-8 -100,8" fill="#1A1A1A"/>
    <polygon points="0,120 -8,100 8,100" fill="#1A1A1A"/>

    <!-- Center Point -->
    <circle r="8" fill="#BC002D"/>
    <circle r="4" fill="#FFFFFF"/>
  </g>

  <!-- Notice Badge -->
  <g transform="translate(400, 420)">
    <rect x="-210" y="-24" width="420" height="48" rx="4" fill="#1A1A1A" opacity="0.9"/>
    <text x="0" y="4" font-family="'Noto Sans JP', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      Diagrama do Embusen em fase de vetorização
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="480" font-family="'Noto Sans JP', 'Inter', sans-serif" font-size="12" fill="#1A1A1A" opacity="0.5" text-anchor="middle">
    O mapa visual de movimentação e passos será carregado em breve.
  </text>
</svg>
